<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
    <script
      src="https://kit.fontawesome.com/9ada813903.js"
      crossorigin="anonymous"
    ></script>
</head>
<body>
    <nav>
        <div class="nav__container">
          <ul class="nav__links">
            <li><a class="nav__link" href="#">HOME</a></li>
            <li><a class="nav__link" href="#">FIND A MOVIE</a></li>
            <button class="nav__link--btn">CONTACT</button>
           
          </ul>
      </div>
      

    <div class="title__search"> 
        <div class="title__search--container">
          <input type="text" placeholder="Search By Movie Title" onchange="searchChange(event)">
        </div>
      </div>
</nav>
    

    <div class="container">
        <div class="row">
            <div class="results__filter">
            <div class="results__wrapper">
                <Span class="results">Search Results For...</Span>
                <span class="search__name"></span>
            </div>
    <select id="filter" onchange="filterMovies(event)">
        <option value="" disabled selected>Sort By Year</option>
        <option value="newest">Newest To Oldest</option>
        <option value="oldest">Oldest To Newest</option>
      </select>
    </div>
      <div class="movies__loading">
      <i class="fas fa-spinner movies__loading--spinner"></i>
     </div>

    <section class="search">
<div class="movies">

</div>
    </section>

          </div>      
           </div>      
   
           <script src="index.js"></script>
</body>
</html>
